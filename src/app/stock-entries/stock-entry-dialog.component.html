<div class="dialog-container">
  <h2 mat-dialog-title>Nhập kho</h2>
  
  <mat-dialog-content>
    <form [formGroup]="stockEntryForm" class="stock-entry-form">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Ngày nhập</mat-label>
          <input matInput type="date" formControlName="date" required>
          <mat-error *ngIf="stockEntryForm.get('date')?.hasError('required')">
            Ngày nhập là bắt buộc
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Nguyên liệu</mat-label>
          <mat-select formControlName="ingredientId" required>
            <mat-option *ngFor="let ingredient of ingredients" [value]="ingredient.id">
              {{ingredient.name}} ({{ingredient.unit}})
            </mat-option>
          </mat-select>
          <mat-error *ngIf="stockEntryForm.get('ingredientId')?.hasError('required')">
            Nguyên liệu là bắt buộc
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Số lượng</mat-label>
          <input matInput type="number" formControlName="quantity" min="0.1" step="0.1" required>
          <mat-error *ngIf="stockEntryForm.get('quantity')?.hasError('required')">
            Số lượng là bắt buộc
          </mat-error>
          <mat-error *ngIf="stockEntryForm.get('quantity')?.hasError('min')">
            Số lượng phải lớn hơn 0
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Đơn giá (VNĐ)</mat-label>
          <input matInput type="number" formControlName="unitPrice" min="0" required>
          <mat-error *ngIf="stockEntryForm.get('unitPrice')?.hasError('required')">
            Đơn giá là bắt buộc
          </mat-error>
          <mat-error *ngIf="stockEntryForm.get('unitPrice')?.hasError('min')">
            Đơn giá không thể âm
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Nhà cung cấp</mat-label>
          <input matInput formControlName="supplier">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Ghi chú</mat-label>
          <textarea matInput formControlName="note" rows="2"></textarea>
        </mat-form-field>
      </div>

      <div class="total-display">
        <strong>Tổng tiền: {{totalCost | number}} VNĐ</strong>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Hủy</button>
    <button mat-raised-button color="primary" 
            (click)="onSave()" 
            [disabled]="!stockEntryForm.valid || loading">
      Nhập kho
    </button>
  </mat-dialog-actions>
</div>
